tin *\u002F\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"4a0554d7-9b21-4122-81c5-a1c6260e4fe4\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>:root {\n  --cream: #faf8f4;\n  --cream-2: #f4f0e6;\n  --indigo: #4a3b8c;\n  --indigo-deep: #3a2e70;\n  --indigo-light: #e8e3f5;\n  --indigo-soft: #f1edfa;\n  --green: #2d7a52;\n  --green-light: #e8f5ee;\n  --green-soft: #d5ebdd;\n  --amber: #8a5900;\n  --amber-light: #faeeda;\n  --amber-soft: #f3dcb6;\n  --red: #c0392b;\n  --red-light: #fae6e3;\n  --red-soft: #f2d4cf;\n  --text: #2d2520;\n  --text-soft: #5b5049;\n  --muted: #b5a99e;\n  --card: #ffffff;\n  --border: #ede6db;\n  --border-soft: #f4eee1;\n  --shadow-sm: 0 1px 2px rgba(45,37,32,0.04);\n  --shadow: 0 2px 0 rgba(74,59,140,0.02), 0 10px 28px rgba(74,59,140,0.06), 0 1px 2px rgba(45,37,32,0.04);\n  --shadow-lg: 0 4px 0 rgba(74,59,140,0.02), 0 24px 56px rgba(74,59,140,0.10), 0 2px 6px rgba(45,37,32,0.04);\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; background: #000; }\nbody {\n  font-family: 'Plus Jakarta Sans', 'Manrope', -apple-system, sans-serif;\n  color: var(--text);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n\u002F* =========== SLIDE SHELL =========== *\u002F\n.slide {\n  background: var(--cream);\n  color: var(--text);\n  padding: 88px 104px 120px;\n  display: flex;\n  flex-direction: column;\n  position: relative;\n  font-size: 22px;\n  line-height: 1.5;\n}\n@keyframes deckSlideIn {\n  0%   { opacity: 0; transform: translateY(18px) scale(0.99); }\n  100% { opacity: 1; transform: translateY(0) scale(1); }\n}\ndeck-stage > [data-deck-active] {\n  animation: deckSlideIn 520ms cubic-bezier(.22,.9,.26,1) both;\n}\n.slide.section-accent::before {\n  content: \"\";\n  position: absolute;\n  top: 88px;\n  bottom: 120px;\n  left: 0;\n  width: 6px;\n  background: var(--indigo);\n  border-radius: 0 6px 6px 0;\n}\n\n\u002F* Logo bottom-left *\u002F\n.chrome-logo {\n  position: absolute;\n  left: 72px;\n  bottom: 56px;\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  font-family: 'Plus Jakarta Sans', sans-serif;\n  font-weight: 800;\n  font-size: 20px;\n  letter-spacing: -0.03em;\n  color: var(--text);\n}\n.chrome-logo .mark {\n  position: relative;\n  display: inline-block;\n}\n.chrome-logo .mark::after {\n  content: \"\";\n  position: absolute;\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: var(--indigo);\n  right: -1px;\n  top: 4px;\n}\n.chrome-logo .tag {\n  padding-left: 14px;\n  margin-left: 2px;\n  border-left: 1px solid var(--border);\n  font-size: 13px;\n  font-weight: 500;\n  color: var(--muted);\n  letter-spacing: 0;\n}\n\n\u002F* Page number bottom-right *\u002F\n.chrome-num {\n  position: absolute;\n  right: 88px;\n  bottom: 58px;\n  font-family: 'Manrope', sans-serif;\n  font-weight: 500;\n  font-size: 13px;\n  color: var(--muted);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: 0.12em;\n}\n.chrome-num b { color: var(--text); font-weight: 700; }\n\n\u002F* =========== TYPE =========== *\u002F\nh1.slide-title {\n  font-family: 'Plus Jakarta Sans', sans-serif;\n  font-weight: 800;\n  font-size: 62px;\n  line-height: 1.08;\n  letter-spacing: -0.028em;\n  margin: 0;\n  color: var(--text);\n  text-wrap: balance;\n}\nh1.slide-title em { color: var(--indigo); font-style: normal; }\n.slide-subtitle {\n  font-family: 'Plus Jakarta Sans', sans-serif;\n  font-weight: 500;\n  font-size: 24px;\n  color: var(--text-soft);\n  margin: 18px 0 0;\n  letter-spacing: -0.005em;\n  max-width: 1100px;\n}\n.eyebrow {\n  font-family: 'Manrope', sans-serif;\n  font-weight: 700;\n  font-size: 13px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--indigo);\n  margin: 0 0 16px;\n}\n\n\u002F* =========== CARDS =========== *\u002F\n.card {\n  background: var(--card);\n  border-radius: 20px;\n  padding: 32px;\n  box-shadow: var(--shadow);\n}\n.card.tint-indigo { background: var(--indigo-soft); box-shadow: none; }\n.card.tint-green { background: var(--green-light); box-shadow: none; }\n.card.tint-amber { background: var(--amber-light); box-shadow: none; }\n.card.tint-red { background: var(--red-light); box-shadow: none; }\n\n\u002F* =========== ICON BADGES =========== *\u002F\n.ic {\n  width: 52px; height: 52px;\n  border-radius: 14px;\n  background: var(--card);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n  box-shadow: var(--shadow-sm);\n  color: var(--indigo);\n}\n.ic svg {\n  width: 24px; height: 24px;\n  fill: none;\n  stroke: currentColor;\n  stroke-width: 1.7;\n  stroke-linecap: round;\n  stroke-linejoin: round;\n  overflow: visible;\n}\n.ic.lg { width: 60px; height: 60px; border-radius: 16px; }\n.ic.lg svg { width: 28px; height: 28px; }\n.ic.xl { width: 72px; height: 72px; border-radius: 20px; }\n.ic.xl svg { width: 34px; height: 34px; }\n.ic.indigo { background: var(--indigo-light); color: var(--indigo); }\n.ic.green { background: var(--green-soft); color: var(--green); }\n.ic.amber { background: var(--amber-soft); color: var(--amber); }\n.ic.red { background: var(--red-soft); color: var(--red); }\n.ic.solid-indigo { background: var(--indigo); color: #fff; }\n\n\u002F* =========== PILLS =========== *\u002F\n.pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 16px;\n  background: var(--card);\n  border-radius: 999px;\n  font-weight: 600;\n  font-size: 16px;\n  color: var(--text);\n  box-shadow: var(--shadow-sm);\n  font-family: 'Plus Jakarta Sans', sans-serif;\n}\n.pill .dot-sm { width: 9px; height: 9px; border-radius: 50%; }\n.pill.indigo { background: var(--indigo-light); color: var(--indigo-deep); }\n.pill.green { background: var(--green-soft); color: var(--green); }\n.pill.amber { background: var(--amber-soft); color: var(--amber); }\n.pill.red { background: var(--red-soft); color: var(--red); }\n.pill svg { width: 18px; height: 18px; stroke-width: 1.8; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n\n\u002F* =========== CHECKS LIST =========== *\u002F\n.checks { list-style: none; padding: 0; margin: 0; }\n.checks li {\n  display: flex;\n  align-items: flex-start;\n  gap: 16px;\n  padding: 16px 0;\n  font-size: 22px;\n  line-height: 1.4;\n  color: var(--text);\n  font-weight: 500;\n}\n.checks li + li { border-top: 1px solid var(--border); }\n.checks .tick {\n  flex-shrink: 0;\n  width: 30px; height: 30px;\n  border-radius: 50%;\n  background: var(--indigo-light);\n  color: var(--indigo);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  margin-top: 1px;\n}\n.checks .tick svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }\n\n\u002F* =========== WORDMARK =========== *\u002F\n.wordmark {\n  font-family: 'Plus Jakarta Sans', sans-serif;\n  font-weight: 800;\n  letter-spacing: -0.055em;\n  line-height: 0.9;\n  color: var(--text);\n  margin: 0;\n  position: relative;\n  display: inline-block;\n}\n.wordmark .dot-b {\n  position: absolute;\n  border-radius: 50%;\n  background: var(--indigo);\n}\n<\u002Fstyle>\n<style>\u002F* ---------- SLIDE 1 : COVER ---------- *\u002F\n.s-cover {\n  padding: 0;\n  align-items: center;\n  justify-content: center;\n  overflow: hidden;\n  background: var(--cream);\n}\n.s-cover .blob {\n  position: absolute;\n  width: 1600px; height: 1600px;\n  border-radius: 50%;\n  background: radial-gradient(circle at 30% 30%, rgba(74,59,140,0.12), rgba(74,59,140,0) 62%);\n  top: -600px; right: -450px;\n  pointer-events: none;\n}\n.s-cover .blob-2 {\n  position: absolute;\n  width: 1100px; height: 1100px;\n  border-rad r-tag-mark');\n    if (!mark) return;\n    mark.className = 'tag-mark';\n    mark.style.cssText = '';\n    mark.textContent = '';\n    if (v === 'emoji') {\n      mark.textContent = '🇺🇿';\n      mark.style.cssText = 'font-size:22px; line-height:1; display:inline-block;';\n    } else if (v === 'flag') {\n      mark.className = 'tag-mark flag';\n    } else if (v === 'dot') {\n      mark.style.cssText = 'display:inline-block; width:10px; height:10px; border-radius:50%; background:#4a3b8c;';\n    } else {\n      mark.style.cssText = 'display:none;';\n    }\n    \u002F\u002F refresh option highlights\n    document.querySelectorAll('#tweak-flag-opts .tw-opt').forEach(b => {\n      b.style.borderColor = b.dataset.val === v ? '#4a3b8c' : '#ede6db';\n      b.style.background = b.dataset.val === v ? '#f1edfa' : '#faf8f4';\n    });\n  }\n\n  function applyAll() { applyFlagMark(state.flagMark); }\n  applyAll();\n\n  \u002F\u002F Panel interactions\n  document.querySelectorAll('#tweak-flag-opts .tw-opt').forEach(btn => {\n    btn.addEventListener('click', () => {\n      state.flagMark = btn.dataset.val;\n      applyFlagMark(state.flagMark);\n      try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { flagMark: state.flagMark } }, '*'); } catch(e) {}\n    });\n  });\n\n  \u002F\u002F Edit-mode protocol\n  const panel = document.getElementById('tweaks-panel');\n  window.addEventListener('message', (e) => {\n    const d = e.data || {};\n    if (d.type === '__activate_edit_mode') panel.style.display = 'block';\n    if (d.type === '__deactivate_edit_mode') panel.style.display = 'none';\n  });\n  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e) {}\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
